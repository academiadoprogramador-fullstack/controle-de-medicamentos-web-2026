name: Mock Deploy Azure Web App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 10.0.x
  WEBAPP_PROJECT: eAgenda.WebApp/eAgenda.WebApp.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  deploy:
    name: Build, migrate database and deploy app
    runs-on: ubuntu-latest
    environment: production-mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.WEBAPP_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.WEBAPP_PROJECT }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.WEBAPP_PROJECT }} --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Web App settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --settings \
                "ASPNETCORE_ENVIRONMENT=Production" \
                "ConnectionStrings__SqlServer=${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply ORM migrations to Azure SQL
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project "eAgenda.WebApp/eAgenda.WebApp.csproj" \
            --startup-project "eAgenda.WebApp/eAgenda.WebApp.csproj" \
            --context EAgendaDbContext \
            --connection "$AZURE_SQL_CONNECTION_STRING"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
